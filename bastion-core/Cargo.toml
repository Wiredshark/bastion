[package]
name = "bastion-core"
version = "0.18.0"
edition = "2024"

# ★ SPEED ROW: invert the veloren-server -> bastion-server edge.
# This crate holds ONLY what `veloren-server` needs from the bastion side, so
# that `veloren-server` can depend on THIS instead of on `bastion-server`. The
# 23k-line job logic then sits ABOVE veloren-server and a one-line edit to it
# no longer forces veloren-server's 9.95 s rebuild.
# Closure measured before any code moved: 6,616 of 32,244 lines (20.5%), with
# zero back-references from the moving set into the logic that stays.

[dependencies]
common = { package = "veloren-common", path = "../common" }
common-ecs = { package = "veloren-common-ecs", path = "../common/ecs" }
common-state = { package = "veloren-common-state", path = "../common/state" }
common-net = { package = "veloren-common-net", path = "../common/net" }
common-systems = { package = "veloren-common-systems", path = "../common/systems" }
world = { package = "veloren-world", path = "../world" }
rtsim = { package = "veloren-rtsim", path = "../rtsim" }
specs = { workspace = true, features = ["shred-derive"] }
tracing = { workspace = true }
vek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ron = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
hashbrown = { workspace = true }
enum-map = { workspace = true }

[package]
name = "bastion-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Project Bastion headless simulation harness: boots world + rtsim + server without voxygen, ticks a seeded world, dumps deterministic aggregate state."

[lints]
workspace = true

[build-dependencies]
chrono = { workspace = true }

[dependencies]
server = { package = "veloren-server", path = "../server" }
common = { package = "veloren-common", path = "../common" }
# DETRNG (B8 root fix): direct dep only to flip rtsim::DETERMINISTIC_RTSIM at
# boot — the harness runs reproducibly; the live game keeps its entropy.
rtsim = { package = "veloren-rtsim", path = "../rtsim" }

chrono = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
vek = { workspace = true }
serde_json = { workspace = true }
specs = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

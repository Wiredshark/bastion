[package]
name = "bastion-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
worldgen = []

[dependencies]
common = { package = "veloren-common", path = "../common" }
common-ecs = { package = "veloren-common-ecs", path = "../common/ecs" }
common-state = { package = "veloren-common-state", path = "../common/state" }
common-net = { package = "veloren-common-net", path = "../common/net" }
common-systems = { package = "veloren-common-systems", path = "../common/systems" }
world = { package = "veloren-world", path = "../world" }
rtsim = { package = "veloren-rtsim", path = "../rtsim" }
specs = { workspace = true, features = ["shred-derive"] }
tracing = { workspace = true }
vek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ron = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
hashbrown = { workspace = true }
sha2 = { workspace = true }
enum-map = { workspace = true }

[dev-dependencies]
# Test-only: construct ordered NpcId (slotmap) keys for the DET-MOOD-003 fixture.
slotmap = "1.0"
# Test-only: `WorldSim::generate` takes a `&rayon::ThreadPool`, and the
# bastion_growth pins build a real world to grow a town in.
rayon = { workspace = true }
# Test-only: install a subscriber so the bastion_growth pins actually SHOW the
# witness line they claim to emit. Without one, `tracing::info!` is a no-op and
# a witness nobody has ever seen fire is an unverified instrument.
tracing-subscriber = { workspace = true }
